<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Checador de Horarios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh}
.app{max-width:460px;margin:0 auto;padding:1rem}
h1{text-align:center;font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:1.25rem;padding-top:.5rem}
.tab-bar{display:flex;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:1.25rem;background:#fff}
.tab{flex:1;padding:10px 4px;font-size:13px;background:#fff;border:none;cursor:pointer;color:#888}
.tab.active{background:#f0f0f0;color:#1a1a1a;font-weight:600}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{font-size:13px;color:#888;display:block;margin-bottom:4px;margin-top:12px}
select,input[type=text],input[type=number],input[type=password]{width:100%;padding:11px 13px;font-size:15px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#1a1a1a;-webkit-appearance:none;appearance:none}
select:focus,input:focus{outline:none;border-color:#1D9E75}
.pin-row{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pin-digit{width:54px;height:62px;font-size:26px;font-weight:600;text-align:center;border:1px solid #ddd;border-radius:12px;background:#fff;color:#1a1a1a;line-height:62px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.numpad button{padding:15px;font-size:20px;font-weight:500;border:1px solid #e5e5e5;border-radius:12px;background:#f9f9f9;color:#1a1a1a;cursor:pointer;transition:all .1s}
.numpad button:active{background:#e5e5e5;transform:scale(0.95)}
.btn{width:100%;padding:14px;font-size:16px;font-weight:600;border-radius:12px;border:none;cursor:pointer;margin-top:10px;transition:all .15s}
.btn-in{background:#1D9E75;color:#fff}
.btn-out{background:#D85A30;color:#fff}
.btn-sec{background:#f0f0f0;color:#1a1a1a;border:1px solid #ddd}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{text-align:center;padding:.85rem 1rem;border-radius:12px;font-size:14px;margin-top:12px}
.msg-ok{background:#E1F5EE;color:#0F6E56}
.msg-err{background:#FAECE7;color:#993C1D}
.msg-warn{background:#FAEEDA;color:#633806}
.msg-info{background:#E6F1FB;color:#185FA5}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge-in{background:#E1F5EE;color:#0F6E56}
.badge-out{background:#FAECE7;color:#993C1D}
.log-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.log-row:last-child{border-bottom:none}
.empty{text-align:center;color:#aaa;font-size:14px;padding:2rem 0}
.sec-title{font-size:11px;font-weight:700;color:#aaa;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em}
.emp-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px;gap:8px}
.emp-row:last-child{border-bottom:none}
.avatar{width:34px;height:34px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#185FA5;flex-shrink:0}
.geo-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:#888;padding:8px 0;margin-bottom:4px}
.geo-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.filter-row{display:flex;gap:8px;margin-bottom:.85rem}
.filter-row select{font-size:13px;padding:8px 10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.pin-input-emp{width:90px;text-align:center;letter-spacing:4px;font-size:17px;padding:7px 8px}
</style>
</head>
<body>
<div class="app">
  <h1>🕐 Checador de Horarios</h1>

  <div id="screen-empleado">
    <div class="tab-bar">
      <button class="tab active" onclick="showTab('fichar')">Fichar</button>
      <button class="tab" onclick="showTab('registros')">Registros</button>
      <button class="tab" onclick="showTab('admin-login')">Admin</button>
    </div>

    <!-- FICHAR -->
    <div id="tab-fichar">
      <div class="card">
        <div class="sec-title">¿Quién eres?</div>
        <select id="sel-emp" onchange="onEmpChange()">
          <option value="">— Selecciona tu nombre —</option>
        </select>
        <div id="pin-section" style="display:none">
          <label style="margin-top:14px;text-align:center;display:block">Tu PIN de 4 dígitos</label>
          <div class="pin-row">
            <div class="pin-digit" id="pd0">·</div>
            <div class="pin-digit" id="pd1">·</div>
            <div class="pin-digit" id="pd2">·</div>
            <div class="pin-digit" id="pd3">·</div>
          </div>
          <div class="numpad">
            <button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
            <button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
            <button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
            <button onclick="pinKey('C')" style="font-size:13px">Borrar</button>
            <button onclick="pinKey('0')">0</button>
            <button onclick="pinKey('OK')" style="background:#1D9E75;color:#fff;font-size:13px">OK</button>
          </div>
        </div>
        <div id="pin-msg"></div>
      </div>

      <div id="fichar-panel" style="display:none">
        <div class="card">
          <div class="geo-bar">
            <div class="geo-dot" id="geo-dot" style="background:#FAC775"></div>
            <span id="geo-txt">Verificando ubicación...</span>
          </div>
          <div id="tienda-detectada" style="font-size:13px;color:#888;margin-bottom:6px"></div>
          <button class="btn btn-in" id="btn-entrada" onclick="fichar('entrada')" disabled>✓ Registrar ENTRADA</button>
          <button class="btn btn-out" id="btn-salida" onclick="fichar('salida')" style="margin-top:8px" disabled>✗ Registrar SALIDA</button>
          <div id="fichar-msg"></div>
        </div>
        <div id="ultimo-registro" style="display:none" class="card">
          <div class="sec-title">Tu último registro</div>
          <div id="ultimo-txt"></div>
        </div>
      </div>
    </div>

    <!-- REGISTROS -->
    <div id="tab-registros" style="display:none">
      <div class="filter-row">
        <select id="fil-tienda" onchange="renderLog()">
          <option value="">Ambas tiendas</option>
          <option value="Palmas">Palmas</option>
          <option value="Altavista">Altavista</option>
        </select>
        <select id="fil-emp" onchange="renderLog()">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="card">
        <div id="log-list"><div class="empty"><span class="spinner"></span> Cargando...</div></div>
      </div>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="tab-admin-login" style="display:none">
      <div class="card">
        <div class="sec-title">Acceso administrador</div>
        <label>PIN de administrador</label>
        <input type="password" id="admin-pin-input" maxlength="4" placeholder="••••" style="text-align:center;letter-spacing:6px;font-size:22px">
        <button class="btn btn-sec" style="margin-top:12px" onclick="loginAdmin()">Entrar como admin</button>
        <div id="admin-login-msg"></div>
      </div>
    </div>
  </div>

  <!-- PANEL ADMIN -->
  <div id="screen-admin" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <span style="font-size:17px;font-weight:700">Panel Admin — Salomón</span>
      <button onclick="logoutAdmin()" style="font-size:13px;background:none;border:none;cursor:pointer;color:#888;text-decoration:underline">Salir</button>
    </div>
    <div class="tab-bar">
      <button class="tab active" id="atab-reg" onclick="showAdminTab('reg')">Registros</button>
      <button class="tab" id="atab-emp" onclick="showAdminTab('emp')">Empleados</button>
      <button class="tab" id="atab-cfg" onclick="showAdminTab('cfg')">Config</button>
    </div>

    <div id="atab-reg-panel">
      <div class="filter-row">
        <select id="afil-tienda" onchange="renderAdminLog()">
          <option value="">Ambas tiendas</option>
          <option value="Palmas">Palmas</option>
          <option value="Altavista">Altavista</option>
        </select>
        <select id="afil-emp" onchange="renderAdminLog()">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="card">
        <div id="admin-log-list"><div class="empty"><span class="spinner"></span> Cargando...</div></div>
      </div>
      <button onclick="exportCSV()" class="btn btn-sec" style="margin-top:.5rem">📥 Exportar CSV</button>
    </div>

    <div id="atab-emp-panel" style="display:none">
      <div class="card">
        <div class="sec-title">Empleados y PINs</div>
        <div id="emp-list"></div>
      </div>
      <p style="font-size:12px;color:#aaa;text-align:center;margin-top:.5rem">Escribe el PIN y presiona Enter o haz clic fuera para guardar</p>
    </div>

    <div id="atab-cfg-panel" style="display:none">
      <div class="card">
        <div class="sec-title">PIN de administrador</div>
        <label>Nuevo PIN (4 dígitos)</label>
        <input type="password" id="new-admin-pin" maxlength="4" placeholder="••••" style="text-align:center;letter-spacing:6px;font-size:22px">
        <button class="btn btn-sec" onclick="changeAdminPin()" style="margin-top:10px">Cambiar PIN admin</button>
        <div id="cfg-msg"></div>
      </div>
      <div style="text-align:center;margin-top:1rem">
        <button onclick="if(confirm('¿Borrar TODOS los registros de Google Sheets? Esta acción no se puede deshacer.')){alert('Para borrar registros, hazlo directamente en tu Google Sheet.')}" style="font-size:13px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline">Información sobre borrar registros</button>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZGJ8ZF7m2F8fTu7tmsiULW4QEknMpGZeEhNdtGGMVrJ_e0AJetqMyuSjeX5wYQe8WcA/exec';

const TIENDAS = {
  Palmas:   { lat: 19.4294033,       lng: -99.21242869999999 },
  Altavista:{ lat: 19.347868899999998, lng: -99.1920871 }
};

const RADIO_METROS = 100;

function dist(la1,lo1,la2,lo2){
  const R=6371000,dLat=(la2-la1)*Math.PI/180,dLon=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

const KEY_E='chk_emp3', KEY_A='chk_adminpin3';

const EMPLEADOS_DEF=[
  {nombre:'Raquel',pin:''},{nombre:'Stephanie',pin:''},{nombre:'Hans',pin:''},
  {nombre:'Adriana',pin:''},{nombre:'Ariam',pin:''},{nombre:'Ruth',pin:''},
  {nombre:'Sylvia',pin:''},{nombre:'Gerardo',pin:''},{nombre:'Ana',pin:''},
  {nombre:'David',pin:''},{nombre:'Salomón',pin:''}
];

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let empleados = load(KEY_E, EMPLEADOS_DEF);
let adminPin  = load(KEY_A, '1234');
let pinBuffer = '';
let empSeleccionado = null;
let tiendaActual    = null;
let geoOk           = false;
let logCache        = [];

async function postRegistro(data){
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'text/plain'}});
    return true;
  }catch(e){return false}
}

async function fetchRegistros(){
  try{
    const r = await fetch(SCRIPT_URL+'?t='+Date.now());
    const rows = await r.json();
    return rows.filter(r=>r[0]&&r[0]!=='Empleado');
  }catch(e){return []}
}

function initSelects(){
  const s = document.getElementById('sel-emp');
  s.innerHTML = '<option value="">— Selecciona tu nombre —</option>';
  empleados.forEach((e,i)=> s.innerHTML += `<option value="${i}">${e.nombre}</option>`);
  ['fil-emp','afil-emp'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    el.innerHTML='<option value="">Todos</option>';
    empleados.forEach(e=> el.innerHTML+=`<option value="${e.nombre}">${e.nombre}</option>`);
  });
}

function onEmpChange(){
  pinBuffer=''; updatePinDisplay();
  const idx = document.getElementById('sel-emp').value;
  document.getElementById('pin-section').style.display = idx!==''?'block':'none';
  document.getElementById('fichar-panel').style.display = 'none';
  document.getElementById('pin-msg').innerHTML = '';
  empSeleccionado = idx!==''? empleados[parseInt(idx)] : null;
}

function updatePinDisplay(){
  for(let i=0;i<4;i++) document.getElementById('pd'+i).textContent = i<pinBuffer.length?'●':'·';
}

function pinKey(k){
  if(k==='C'){pinBuffer=pinBuffer.slice(0,-1);updatePinDisplay();return}
  if(k==='OK'){checkPin();return}
  if(pinBuffer.length<4){pinBuffer+=k;updatePinDisplay()}
  if(pinBuffer.length===4) setTimeout(checkPin,120);
}

function checkPin(){
  const idx = document.getElementById('sel-emp').value;
  if(idx==='')return;
  const emp = empleados[parseInt(idx)];
  if(!emp.pin){
    document.getElementById('pin-msg').innerHTML='<div class="msg msg-warn">⚠️ Sin PIN asignado. Pídele al administrador que lo configure.</div>';
    pinBuffer=''; updatePinDisplay(); return;
  }
  if(pinBuffer===emp.pin){
    empSeleccionado = emp;
    document.getElementById('pin-msg').innerHTML='';
    document.getElementById('pin-section').style.display='none';
    document.getElementById('fichar-panel').style.display='block';
    checkGeo(); showUltimo();
  } else {
    document.getElementById('pin-msg').innerHTML='<div class="msg msg-err">❌ PIN incorrecto. Intenta de nuevo.</div>';
    pinBuffer=''; updatePinDisplay();
  }
}

function checkGeo(){
  const dot=document.getElementById('geo-dot');
  const txt=document.getElementById('geo-txt');
  const det=document.getElementById('tienda-detectada');
  dot.style.background='#FAC775'; txt.textContent='Verificando ubicación...';
  det.textContent=''; geoOk=false; tiendaActual=null;
  document.getElementById('btn-entrada').disabled=true;
  document.getElementById('btn-salida').disabled=true;

  if(!navigator.geolocation){
    dot.style.background='#E24B4A'; txt.textContent='GPS no disponible en este dispositivo'; return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:la,longitude:lo}=pos.coords;
    let cercana=null, minDist=Infinity;
    for(const[nombre,coords] of Object.entries(TIENDAS)){
      const d=dist(la,lo,coords.lat,coords.lng);
      if(d<minDist){minDist=d;cercana=nombre}
    }
    if(minDist<=RADIO_METROS){
      geoOk=true; tiendaActual=cercana;
      dot.style.background='#1D9E75';
      txt.textContent='✓ Ubicación verificada';
      det.textContent=`Tienda ${cercana} (${Math.round(minDist)}m de distancia)`;
      document.getElementById('btn-entrada').disabled=false;
      document.getElementById('btn-salida').disabled=false;
    } else {
      dot.style.background='#E24B4A';
      txt.textContent=`Estás a ${Math.round(minDist)}m de la tienda más cercana (${cercana})`;
      det.textContent=`Necesitas estar a menos de ${RADIO_METROS}m para poder fichar`;
    }
  }, ()=>{
    dot.style.background='#E24B4A';
    txt.textContent='No se pudo obtener ubicación. Activa el GPS e intenta de nuevo.';
  },{enableHighAccuracy:true, timeout:12000});
}

async function fichar(tipo){
  if(!geoOk||!tiendaActual||!empSeleccionado) return;
  const now=new Date();
  const fecha=now.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
  const hora=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const m=document.getElementById('fichar-msg');
  m.innerHTML='<div class="msg msg-info"><span class="spinner"></span>Guardando en Google Sheets...</div>';
  document.getElementById('btn-entrada').disabled=true;
  document.getElementById('btn-salida').disabled=true;

  const ok = await postRegistro({empleado:empSeleccionado.nombre, tienda:tiendaActual, tipo, fecha, hora});
  if(ok){
    const ico = tipo==='entrada'?'✓':'✗';
    m.innerHTML=`<div class="msg msg-ok">${ico} ${tipo.charAt(0).toUpperCase()+tipo.slice(1)} registrada correctamente<br><small>${fecha} · ${hora} · Tienda ${tiendaActual}</small></div>`;
    showUltimoLocal({empleado:empSeleccionado.nombre,tienda:tiendaActual,tipo,fecha,hora});
  } else {
    m.innerHTML='<div class="msg msg-err">❌ Error de conexión. Revisa tu internet e intenta de nuevo.</div>';
    document.getElementById('btn-entrada').disabled=false;
    document.getElementById('btn-salida').disabled=false;
  }
  setTimeout(()=>{m.innerHTML=''; resetFichar()}, 5000);
}

async function showUltimo(){
  if(!empSeleccionado) return;
  const rows = await fetchRegistros();
  const mias = rows.filter(r=>r[0]===empSeleccionado.nombre).reverse();
  if(mias.length) showUltimoLocal({empleado:mias[0][0],tienda:mias[0][1],tipo:mias[0][2],fecha:mias[0][3],hora:mias[0][4]});
}

function showUltimoLocal(r){
  document.getElementById('ultimo-registro').style.display='block';
  document.getElementById('ultimo-txt').innerHTML=
    `<span class="badge badge-${r.tipo}">${r.tipo.toUpperCase()}</span>
     <span style="margin-left:8px;color:#888">${r.fecha} ${r.hora} · ${r.tienda}</span>`;
}

function resetFichar(){
  document.getElementById('sel-emp').value='';
  document.getElementById('pin-section').style.display='none';
  document.getElementById('fichar-panel').style.display='none';
  document.getElementById('ultimo-registro').style.display='none';
  pinBuffer=''; updatePinDisplay();
  empSeleccionado=null; tiendaActual=null; geoOk=false;
}

function showTab(t){
  ['fichar','registros','admin-login'].forEach(x=>{
    document.getElementById('tab-'+x).style.display=x===t?'block':'none';
  });
  document.querySelectorAll('#screen-empleado .tab').forEach((b,i)=>{
    b.classList.toggle('active',['fichar','registros','admin-login'][i]===t);
  });
  if(t==='registros') renderLog();
}

async function renderLog(){
  const ft=document.getElementById('fil-tienda').value;
  const fe=document.getElementById('fil-emp').value;
  const list=document.getElementById('log-list');
  list.innerHTML='<div class="empty"><span class="spinner"></span> Cargando desde Google Sheets...</div>';
  const rows = await fetchRegistros();
  let filtered=[...rows].reverse().filter(r=>(!ft||r[1]===ft)&&(!fe||r[0]===fe));
  if(!filtered.length){list.innerHTML='<div class="empty">Sin registros aún</div>';return}
  list.innerHTML=filtered.slice(0,80).map(r=>`
    <div class="log-row">
      <span class="badge badge-${r[2]}">${r[2]==='entrada'?'ENTRADA':'SALIDA'}</span>
      <span style="flex:1;font-weight:600">${r[0]}</span>
      <span style="font-size:12px;color:#888;text-align:right">${r[1]}<br>${r[3]} ${r[4]}</span>
    </div>`).join('');
}

function loginAdmin(){
  const p=document.getElementById('admin-pin-input').value;
  if(p===adminPin){
    document.getElementById('screen-empleado').style.display='none';
    document.getElementById('screen-admin').style.display='block';
    document.getElementById('admin-pin-input').value='';
    renderAdminLog(); renderEmpList(); initAdminFilters();
  } else {
    document.getElementById('admin-login-msg').innerHTML='<div class="msg msg-err">PIN incorrecto</div>';
    setTimeout(()=>document.getElementById('admin-login-msg').innerHTML='',2500);
  }
}

function logoutAdmin(){
  document.getElementById('screen-admin').style.display='none';
  document.getElementById('screen-empleado').style.display='block';
  showTab('fichar');
}

function showAdminTab(t){
  ['reg','emp','cfg'].forEach(x=>{
    document.getElementById('atab-'+x+'-panel').style.display=x===t?'block':'none';
    document.getElementById('atab-'+x).classList.toggle('active',x===t);
  });
  if(t==='reg') renderAdminLog();
  if(t==='emp') renderEmpList();
}

function initAdminFilters(){
  const s=document.getElementById('afil-emp');
  s.innerHTML='<option value="">Todos</option>';
  empleados.forEach(e=> s.innerHTML+=`<option value="${e.nombre}">${e.nombre}</option>`);
}

async function renderAdminLog(){
  const ft=document.getElementById('afil-tienda').value;
  const fe=document.getElementById('afil-emp').value;
  const list=document.getElementById('admin-log-list');
  list.innerHTML='<div class="empty"><span class="spinner"></span> Cargando desde Google Sheets...</div>';
  const rows = await fetchRegistros();
  logCache = rows;
  let filtered=[...rows].reverse().filter(r=>(!ft||r[1]===ft)&&(!fe||r[0]===fe));
  if(!filtered.length){list.innerHTML='<div class="empty">Sin registros</div>';return}
  list.innerHTML=filtered.slice(0,100).map(r=>`
    <div class="log-row">
      <span class="badge badge-${r[2]}">${r[2]==='entrada'?'ENT':'SAL'}</span>
      <span style="flex:1;font-weight:600;font-size:13px">${r[0]}</span>
      <span style="font-size:12px;color:#888;text-align:right">${r[1]}<br>${r[3]} ${r[4]}</span>
    </div>`).join('');
}

function renderEmpList(){
  const el=document.getElementById('emp-list');
  el.innerHTML=empleados.map((e,i)=>`
    <div class="emp-row">
      <div class="avatar">${e.nombre.charAt(0)}</div>
      <span style="flex:1">${e.nombre}</span>
      <input type="password" maxlength="4" placeholder="${e.pin?'****':'Sin PIN'}" value="${e.pin}"
        class="pin-input-emp"
        onchange="setPin(${i},this.value)">
    </div>`).join('');
}

function setPin(i,val){
  if(val&&!/^\d{4}$/.test(val)){alert('El PIN debe ser exactamente 4 dígitos numéricos (ej. 1234)');return}
  empleados[i].pin=val;
  save(KEY_E,empleados);
}

function changeAdminPin(){
  const np=document.getElementById('new-admin-pin').value;
  if(!/^\d{4}$/.test(np)){
    document.getElementById('cfg-msg').innerHTML='<div class="msg msg-err">El PIN debe ser exactamente 4 dígitos</div>';return;
  }
  adminPin=np; save(KEY_A,adminPin);
  document.getElementById('cfg-msg').innerHTML='<div class="msg msg-ok">✓ PIN de admin actualizado</div>';
  document.getElementById('new-admin-pin').value='';
  setTimeout(()=>document.getElementById('cfg-msg').innerHTML='',3000);
}

function exportCSV(){
  if(!logCache.length){alert('No hay registros para exportar. Carga los registros primero.');return}
  const header=['Empleado','Tienda','Tipo','Fecha','Hora'];
  const csv=[header,...logCache].map(r=>r.slice(0,5).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='checador_registros_'+new Date().toLocaleDateString('es-MX').replace(/\//g,'-')+'.csv';
  a.click();
}

initSelects();
</script>
</body>
</html>
